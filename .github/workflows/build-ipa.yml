name: Build Husk Enhanced IPA

on:
  push:
    branches:
      - main
      - work/audit-bundle-dvm-android
      - fix/tl-memory-test-errno
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    # StikJIT's checked-in XCFramework was built with Swift 6.4 (Xcode 27).
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Xcode and Swift toolchain
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -F "Swift version 6.4"

      - name: Install build tools
        run: brew install autoconf automake cmake libtool meson ninja pkg-config qemu xcodegen

      - name: Install Python modules needed by Meson
        run: |
          PYTHON_PACKAGES="$RUNNER_TEMP/python-packages"
          python3 -m pip install --target "$PYTHON_PACKAGES" PyYAML
          echo "PYTHONPATH=$PYTHON_PACKAGES${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Set up Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build and package SideStore IPA
        env:
          DD: ${{ runner.temp }}/husk-derived-data
        run: ./scripts/ci_build.sh "$RUNNER_TEMP/Husk-Enhanced.ipa"

      - name: Verify diagnostic instrumentation is embedded in the IPA
        run: |
          set -euo pipefail
          IPA="$RUNNER_TEMP/Husk-Enhanced.ipa"
          BINARY="$RUNNER_TEMP/husk-diagnostic-app"
          STRINGS="$RUNNER_TEMP/husk-diagnostic-app.strings"
          # The translation layer is compiled into the app itself, not into the QEMU library: src/app/project.yml and
          # HuskBridge.h both say so. The markers are therefore in the app's Mach-O, not in libqemu-aarch64-softmmu.dylib.
          unzip -p "$IPA" Payload/Husk.app/Husk > "$BINARY"
          strings "$BINARY" > "$STRINGS"
          markers=(
            'unity: DEX NativeLoader.load(String)Z exact='
            'jni: NativeLoader RegisterNatives DEX chain exact='
            'unity: calling libmain JNI_OnLoad'
            'unity: NativeLoader.load -> %d (pending exception=%d)'
            'unity: initJni done (pending exception=%d)'
            'unity: calling first nativeRender'
            'unity: first nativeRender returned %d'
          )
          for marker in "${markers[@]}"; do
            if ! grep -Fq "$marker" "$STRINGS"; then
              echo "Missing diagnostic marker in the packaged app binary: $marker" >&2
              exit 1
            fi
          done
          echo "All Unity/JNI diagnostic markers are present in the IPA's app binary."

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-Enhanced-SideStore-IPA
          path: ${{ runner.temp }}/Husk-Enhanced.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-Enhanced-iOS-build-logs
          path: |
            build/logs/**/*.log
            ${{ runner.temp }}/husk-derived-data/build.log
            ${{ runner.temp }}/husk-range-tests/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
