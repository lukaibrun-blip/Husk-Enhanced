name: Build Husk Enhanced IPA

on:
  push:
    branches:
      - main
      - work/audit-bundle-dvm-android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    # StikJIT's checked-in XCFramework was built with Swift 6.4 (Xcode 27).
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Xcode and Swift toolchain
        run: |
          xcodebuild -version
          swift --version
          swift --version | grep -F "Swift version 6.4"

      - name: Install build tools
        run: brew install autoconf automake cmake libtool meson ninja pkg-config qemu xcodegen

      - name: Install Python modules needed by Meson
        run: |
          PYTHON_PACKAGES="$RUNNER_TEMP/python-packages"
          python3 -m pip install --target "$PYTHON_PACKAGES" PyYAML
          echo "PYTHONPATH=$PYTHON_PACKAGES${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

      - name: Set up Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build and package SideStore IPA
        env:
          DD: ${{ runner.temp }}/husk-derived-data
        run: ./scripts/ci_build.sh "$RUNNER_TEMP/Husk-Enhanced.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-Enhanced-SideStore-IPA
          path: ${{ runner.temp }}/Husk-Enhanced.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Husk-Enhanced-iOS-build-logs
          path: |
            build/logs/**/*.log
            ${{ runner.temp }}/husk-derived-data/build.log
          if-no-files-found: ignore
          retention-days: 7
